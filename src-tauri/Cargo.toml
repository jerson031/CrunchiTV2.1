[package]
name = "tauri-app"
version = "0.1.0"
description = "Crunchyroll Casero TV"
authors = ["you"]
edition = "2024"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "process"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls-no-provider", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
roxmltree = "0.21.2"
urlencoding = "2.1.3"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }


[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7"
jni = "0.21"
ndk-context = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
